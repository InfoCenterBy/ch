<!doctype html>
<html lang="en">
  @@include('components/head.html', {"title": "Регистрация"})

  <body>
    <div class="wrapper">
      @@include('components/header.html')

      <main class="mt-10 mb-10 md:mb-20">
        <div class="container py-10">
          <div class="mx-auto max-w-[760px]">
            <div class="card-border">
              <div class="rounded-3xl bg-neutral-50 p-4 md:p-6">
                <h1 class="heading-1 text-center">РЕГИСТРАЦИЯ</h1>

                <form class="mt-8 space-y-4" action="#" method="post" data-register-form>
                  <div class="form-control w-full">
                    <label class="label" for="phone">
                      <span class="font-medium text-neutral-900"
                        >Номер телефона <span class="text-error">*</span></span
                      >
                    </label>
                    <input
                      id="phone"
                      type="tel"
                      name="phone"
                      class="input input-bordered mt-2 w-full"
                      placeholder="+375(__)___-__-__"
                      autocomplete="tel"
                      data-phone-mask />
                  </div>

                  <div class="form-control w-full">
                    <label class="label" for="password">
                      <span class="font-medium text-neutral-900"
                        >Пароль <span class="text-error">*</span></span
                      >
                    </label>
                    <div class="password-input-wrapper relative mt-2">
                      <input
                        id="password"
                        type="password"
                        name="password"
                        class="input input-bordered w-full pr-12"
                        autocomplete="new-password" />
                      <button
                        type="button"
                        data-password-toggle
                        class="absolute top-1/2 right-2 -translate-y-1/2 cursor-pointer"
                        aria-label="Показать пароль">
                        <svg
                          class="password-icon-crossed size-5 text-neutral-500"
                          xmlns="http://www.w3.org/2000/svg"
                          viewBox="0 0 24 24"
                          fill="currentColor">
                          <path
                            d="M3.53 2.47a.75.75 0 0 0-1.06 1.06l18 18a.75.75 0 1 0 1.06-1.06l-18-18ZM22.676 12.553a11.249 11.249 0 0 1-2.631 4.31l-3.099-3.099a5.25 5.25 0 0 0-6.71-6.71L7.759 4.577a11.217 11.217 0 0 1 4.242-.827c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113Z" />
                          <path
                            d="M15.75 12c0 .18-.013.357-.037.53l-4.244-4.243A3.75 3.75 0 0 1 15.75 12ZM12.53 15.713l-4.243-4.244a3.75 3.75 0 0 0 4.244 4.243Z" />
                          <path
                            d="M6.75 12c0-.619.107-1.213.304-1.764l-3.1-3.1a11.25 11.25 0 0 0-2.63 4.31c-.12.362-.12.752 0 1.114 1.489 4.467 5.704 7.69 10.675 7.69 1.5 0 2.933-.294 4.242-.827l-2.477-2.477A5.25 5.25 0 0 1 6.75 12Z" />
                        </svg>
                        <svg
                          class="password-icon-normal hidden size-5 text-neutral-500"
                          xmlns="http://www.w3.org/2000/svg"
                          viewBox="0 0 24 24"
                          fill="currentColor">
                          <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
                          <path
                            fill-rule="evenodd"
                            d="M1.323 11.447C2.811 6.976 7.028 3.75 12.001 3.75c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113-1.487 4.471-5.705 7.697-10.677 7.697-4.97 0-9.186-3.223-10.675-7.69a1.762 1.762 0 0 1 0-1.113ZM17.25 12a5.25 5.25 0 1 1-10.5 0 5.25 5.25 0 0 1 10.5 0Z"
                            clip-rule="evenodd" />
                        </svg>
                      </button>
                    </div>
                  </div>

                  <div class="form-control w-full">
                    <label class="label" for="password-repeat">
                      <span class="font-medium text-neutral-900">
                        Повторите пароль <span class="text-error">*</span>
                      </span>
                    </label>
                    <div class="password-input-wrapper relative mt-2">
                      <input
                        id="password-repeat"
                        type="password"
                        name="passwordRepeat"
                        class="input input-bordered w-full pr-12"
                        autocomplete="new-password" />
                      <button
                        type="button"
                        data-password-toggle
                        class="absolute top-1/2 right-2 -translate-y-1/2 cursor-pointer"
                        aria-label="Показать пароль">
                        <svg
                          class="password-icon-crossed size-5 text-neutral-500"
                          xmlns="http://www.w3.org/2000/svg"
                          viewBox="0 0 24 24"
                          fill="currentColor">
                          <path
                            d="M3.53 2.47a.75.75 0 0 0-1.06 1.06l18 18a.75.75 0 1 0 1.06-1.06l-18-18ZM22.676 12.553a11.249 11.249 0 0 1-2.631 4.31l-3.099-3.099a5.25 5.25 0 0 0-6.71-6.71L7.759 4.577a11.217 11.217 0 0 1 4.242-.827c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113Z" />
                          <path
                            d="M15.75 12c0 .18-.013.357-.037.53l-4.244-4.243A3.75 3.75 0 0 1 15.75 12ZM12.53 15.713l-4.243-4.244a3.75 3.75 0 0 0 4.244 4.243Z" />
                          <path
                            d="M6.75 12c0-.619.107-1.213.304-1.764l-3.1-3.1a11.25 11.25 0 0 0-2.63 4.31c-.12.362-.12.752 0 1.114 1.489 4.467 5.704 7.69 10.675 7.69 1.5 0 2.933-.294 4.242-.827l-2.477-2.477A5.25 5.25 0 0 1 6.75 12Z" />
                        </svg>
                        <svg
                          class="password-icon-normal hidden size-5 text-neutral-500"
                          xmlns="http://www.w3.org/2000/svg"
                          viewBox="0 0 24 24"
                          fill="currentColor">
                          <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
                          <path
                            fill-rule="evenodd"
                            d="M1.323 11.447C2.811 6.976 7.028 3.75 12.001 3.75c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113-1.487 4.471-5.705 7.697-10.677 7.697-4.97 0-9.186-3.223-10.675-7.69a1.762 1.762 0 0 1 0-1.113ZM17.25 12a5.25 5.25 0 1 1-10.5 0 5.25 5.25 0 0 1 10.5 0Z"
                            clip-rule="evenodd" />
                        </svg>
                      </button>
                    </div>
                  </div>

                  <div class="w-full pt-2">
                    <label class="flex w-full cursor-pointer items-start gap-3">
                      <input
                        type="checkbox"
                        class="checkbox checkbox-primary checkbox-sm mt-0.5 rounded-sm" />
                      <span class="flex-1 leading-[140%] text-neutral-900">
                        Я даю согласие на обработку своих персональных данных в соответствии с
                        <a class="link-primary" href="#">
                          Политикой обработки персональных данных
                        </a>
                        *
                      </span>
                    </label>
                  </div>

                  <div class="mt-10 flex justify-center">
                    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                  </div>

                  <p class="mt-6 text-center text-neutral-900 md:mt-8">
                    Уже есть аккаунт?
                    <a class="link-primary" href="login.html">Авторизуйтесь</a>
                  </p>
                </form>
              </div>
            </div>
          </div>
        </div>
      </main>

      @@include('components/footer.html') @@include('components/mobile-nav.html')
    </div>

    @@include('components/script.html')
  </body>
</html>
