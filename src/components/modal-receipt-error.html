<dialog id="receiptErrorModal" class="modal">
  <div class="modal-box relative rounded-2xl">
    <button
      type="button"
      aria-label="Закрыть"
      class="btn btn-sm btn-circle btn-ghost absolute top-2 right-2 text-neutral-400
        hover:text-neutral-600"
      onclick="receiptErrorModal.close()">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="size-5">
        <path
          fill-rule="evenodd"
          d="M5.47 5.47a.75.75 0 0 1 1.06 0L12 10.94l5.47-5.47a.75.75 0 1 1 1.06 1.06L13.06 12l5.47 5.47a.75.75 0 1 1-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 0 1-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 0 1 0-1.06Z"
          clip-rule="evenodd" />
      </svg>
    </button>
    <div class="flex flex-col items-center gap-4 py-8 text-center">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="size-16 text-red-600">
        <path
          fill-rule="evenodd"
          d="M9.401 3.003c1.155-2 4.043-2 5.197 0l7.355 12.748c1.154 2-.29 4.5-2.599 4.5H4.645c-2.309 0-3.752-2.5-2.598-4.5L9.4 3.003ZM12 8.25a.75.75 0 0 1 .75.75v3.75a.75.75 0 0 1-1.5 0V9a.75.75 0 0 1 .75-.75Zm0 8.25a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Z"
          clip-rule="evenodd" />
      </svg>
      <h3 class="text-lg font-semibold text-neutral-900">Произошла ошибка при проверке чека!</h3>
      <p class="text-neutral-500">Чек не найден в системе контроля кассового оборудования</p>
    </div>
  </div>
  <button
    type="button"
    class="modal-backdrop"
    aria-label="Закрыть"
    onclick="receiptErrorModal.close()"></button>
</dialog>
