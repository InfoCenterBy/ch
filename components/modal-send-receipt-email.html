<dialog id="sendReceiptEmailModal" class="modal">
  <div class="modal-box relative rounded-2xl">
    <button
      type="button"
      aria-label="Закрыть"
      class="btn btn-sm btn-circle btn-ghost absolute top-2 right-2 text-neutral-400
        hover:text-neutral-600"
      onclick="sendReceiptEmailModal.close()">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="size-5">
        <path
          fill-rule="evenodd"
          d="M5.47 5.47a.75.75 0 0 1 1.06 0L12 10.94l5.47-5.47a.75.75 0 1 1 1.06 1.06L13.06 12l5.47 5.47a.75.75 0 1 1-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 0 1-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 0 1 0-1.06Z"
          clip-rule="evenodd" />
      </svg>
    </button>
    <div class="flex flex-col gap-4 pt-6 pb-2">
      <h3 class="text-center text-lg font-semibold text-neutral-900 md:text-left">
        Введите адрес электронной почты
      </h3>
      <input type="email" placeholder="mybox@email.by" class="input input-bordered w-full" />
      <button
        type="button"
        class="btn btn-primary mx-auto"
        onclick="
          sendReceiptEmailModal.close();
          sendReceiptSuccessModal.showModal();
        ">
        Отправить
      </button>
    </div>
  </div>
  <button
    type="button"
    class="modal-backdrop"
    aria-label="Закрыть"
    onclick="sendReceiptEmailModal.close()"></button>
</dialog>
